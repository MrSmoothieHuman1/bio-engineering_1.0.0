[entity-description]
bee-iron-fish=A fish that grows its scales using material from underwater vents, which results in its outer body containing high amounts of iron.
bee-copper-fish=A fish that grows its scales using material from underwater vents, which results in its outer body containing high amounts of copper.

tree-01=Cedasap's are a conifer-like trees that can easily be tapped for this planets resin. Comes in colours of green to cyan.
tree-02=Evergreens are
tree-02-red=Everbrowns
tree-03=Mixleaf's are the most prominent example of symbiotic evolution. Their leaves contain various different types of chloroplasts which lets their leaves have various colours.
tree-04=Cyaelm are similar to [entity=tree-03], where they have various types of chloroplasts in their leaves. Although Cyalem seem to have less genetic diversity which leads to less colour variation.
tree-05=These trees are tiny and have vibrant green foilage.
tree-07=Citruash
tree-08=Taedap's seem to be like a mix of Oak and Juniper trees from back home, with a thick held-up canopy.
tree-08-brown=Brown taedaps are similar to their greener cousins, but have adapted to have browner leaves.
tree-08-red=Burgundy taedaps are an extreme form of brown taedaps and are usually much older. The trunk has noticeably aged and seen better days.
tree-09=Bigtrunks are huge trees with thick hardwood trunks, which are home to various lifeforms.
tree-09-brown=Brown bigtrunks are huge trees with thick hardwood trunks and brown leaves, these are usually older and are teeming with more life then their greener cousins.
tree-09-red=Behemotrunks are the biggest clade of this tree type and are closest to the Redwood trees back home. Each one probably contains an entire ecosystem of its own.

